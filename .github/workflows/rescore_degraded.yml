# .github/workflows/rescore_degraded.yml
# On-demand workflow to rescore jobs whose stored breakdown is missing the
# calibration fields (competitive_context / dimension_scores / one_line_verdict).
#
# Neither the normal scorer (resume_score IS NULL) nor rescore_existing.py
# (resume_score_stage IS NULL) picks these up, so they need their own pass.
# Running this is also how the required-fields schema fix gets verified against
# the live model.

name: Rescore Degraded Scores

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max jobs to rescore (start small to check it works)"
        required: false
        default: "10"
      dry_run:
        description: "List what would be rescored without changing anything"
        type: boolean
        required: false
        default: false

jobs:
  rescore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scoring health before
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python check_scoring_health.py --days 30

      - name: Rescore degraded jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: |
          python rescore_degraded.py \
            --limit ${{ github.event.inputs.limit }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Scoring health after
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python check_scoring_health.py --days 30
