name: Run All (Scrape → Score → Manage → Customize)

on:
  workflow_dispatch: # Manual trigger from the Actions tab
  schedule:
    - cron: "0 10 * * *"  # Every day at 10:00 UTC — must run daily since LinkedIn search uses the past-24h filter

permissions:
  actions: read
  contents: read

jobs:
  check-last-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip if the dashboard was already generated today (UTC)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Look at recent completed runs and find the last one where the
          # "run-all" job (the one that actually reaches "Generate Dashboard")
          # actually succeeded — a run can be "successful" overall while the
          # job itself was skipped by this same check, so we inspect the job,
          # not the run-level conclusion.
          RUN_IDS=$(gh run list --workflow "run_all.yml" --status completed --limit 15 --json databaseId -q '.[].databaseId')

          LAST_COMPLETED=""
          for id in $RUN_IDS; do
            CONCLUSION=$(gh run view "$id" --json jobs -q '.jobs[] | select(.name=="run-all") | .conclusion')
            if [ "$CONCLUSION" = "success" ]; then
              LAST_COMPLETED=$(gh run view "$id" --json jobs -q '.jobs[] | select(.name=="run-all") | .completedAt')
              break
            fi
          done

          if [ -z "$LAST_COMPLETED" ]; then
            echo "No prior run reached a successful dashboard generation — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_DATE=$(date -u -d "$LAST_COMPLETED" +%Y-%m-%d)
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "Dashboard already generated successfully today ($TODAY, UTC) — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last successful dashboard generation was on $LAST_DATE (today is $TODAY, UTC) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  run-all:
    needs: check-last-run
    if: needs.check-last-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found."
            exit 1
          fi

      # ── Step 1: Scrape Jobs ──────────────────────────────────────────
      - name: "1 — Scrape Jobs"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py

      # ── Step 2: Score Jobs ───────────────────────────────────────────
      - name: "2 — Score Jobs"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: python score_jobs.py

      # ── Step 3: Manage Jobs (expire / check activity / delete old) ───
      - name: "3 — Manage Jobs"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python job_manager.py

      # ── Step 4: Customize Resumes (only jobs scoring >= RESUME_CUSTOMIZATION_MIN_SCORE) ──
      - name: "4 — Customize Resumes"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python custom_resume_generator.py

      # ── Step 5: Generate Dashboard ────────────────────────────────────
      - name: "5 — Generate Dashboard"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dashboard.py

      # ── Step 6: Upload Dashboard as Artifact ──────────────────────────
      - name: "6 — Upload Dashboard"
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 7
