name: Run All (Scrape → Score → Manage)

on:
  workflow_dispatch: # Manual trigger from the Actions tab
    inputs:
      sources:
        description: "Comma-separated sources to scrape (e.g. linkedin). Empty = all."
        required: false
        default: ""
  schedule:
    - cron: "0 10 * * *"  # Every day at 10:00 UTC

permissions:
  actions: read
  contents: read

jobs:
  check-last-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      sources: ${{ steps.sources.outputs.list }}
    steps:
      - name: Skip if today's work already happened (UTC)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The question here is NOT "did the run go green" — it is "did today's
          # work already happen". Those two diverge the moment a partial failure
          # is a legitimate outcome, which is exactly what `fail-fast: false` plus
          # the zero-yield guard made routine: a run can go red because one source
          # was blocked while every downstream stage still did its job. Keying on
          # the run or job conclusion would aggregate "a source was broken" with
          # "nothing ran" and re-run the whole pipeline for the former.
          #
          # So this reads a STEP outcome (the dashboard step inside the manage
          # job), not a job conclusion: the dashboard is the last thing the
          # pipeline does, so its success means the pipeline reached the end.
          # Please don't "fix" this back to `.jobs[].conclusion`.
          #
          # Anything other than an explicit "success" counts as not-happened —
          # a skipped step reports "skipped", not "failure", so an `== "failure"`
          # test would silently treat a skipped day as done.
          RUN_IDS=$(gh run list --workflow "run_all.yml" --status completed --limit 15 --json databaseId -q '.[].databaseId')

          LAST_COMPLETED=""
          for id in $RUN_IDS; do
            OUTCOME=$(gh run view "$id" --json jobs \
              -q '.jobs[] | select(.name=="manage") | .steps[] | select(.name=="Generate Dashboard") | .conclusion')
            if [ "$OUTCOME" = "success" ]; then
              LAST_COMPLETED=$(gh run view "$id" --json jobs -q '.jobs[] | select(.name=="manage") | .completedAt')
              break
            fi
          done

          if [ -z "$LAST_COMPLETED" ]; then
            echo "No prior run reached a successful dashboard generation — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_DATE=$(date -u -d "$LAST_COMPLETED" +%Y-%m-%d)
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "Dashboard already generated successfully today ($TODAY, UTC) — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last successful dashboard generation was on $LAST_DATE (today is $TODAY, UTC) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve which sources to scrape
        id: sources
        env:
          REQUESTED: ${{ github.event.inputs.sources }}
        run: |
          # Default matrix. Add a leg here when a new source lands (Arbeitsagentur
          # in Step B.0, the ATS adapters in B.2) — scraper.py --source must know
          # the same name.
          DEFAULT='["linkedin"]'
          if [ -z "$REQUESTED" ]; then
            echo "list=$DEFAULT" >> "$GITHUB_OUTPUT"
          else
            LIST=$(echo "$REQUESTED" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' \
                   | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin]))')
            echo "list=$LIST" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ── Stage 1: scrape ───────────────────────────────────────────────────────
  # One runner per source, in parallel: wall-clock is max(sources), not sum.
  # fail-fast: false — a LinkedIn block must not cancel the other legs, and a leg
  # that fetches zero exits non-zero on purpose (see scrape_guard).
  scrape:
    needs: check-last-run
    if: needs.check-last-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.check-last-run.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Scrape ${{ matrix.source }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py --source "${{ matrix.source }}"

  # ── Stage 2: score ────────────────────────────────────────────────────────
  # !cancelled() rather than success(): whatever did land still deserves scoring.
  # A dead scrape leg shows as a red run; it must not skip the rest of the day.
  score:
    needs: [check-last-run, scrape]
    if: ${{ !cancelled() && needs.check-last-run.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Score Jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: python score_jobs.py

      - name: Customize Resumes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python custom_resume_generator.py

  # ── Stage 3: manage ───────────────────────────────────────────────────────
  # Holds the dashboard step the skip-guard above keys on. Same !cancelled()
  # reasoning: a red scrape leg must not cost us the day's housekeeping.
  manage:
    needs: [check-last-run, score]
    if: ${{ !cancelled() && needs.check-last-run.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Manage Jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python job_manager.py

      # The skip-guard in check-last-run reads THIS step's outcome by name.
      # Renaming it means updating the jq expression above.
      - name: Generate Dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dashboard.py

      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 7
