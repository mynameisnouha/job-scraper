name: Run All (Scrape → Score → Manage)

on:
  workflow_dispatch: # Manual trigger from the Actions tab
    inputs:
      sources:
        description: "Comma-separated sources to scrape (e.g. linkedin). Empty = all."
        required: false
        default: ""
  schedule:
    # Four times a day. LinkedIn's search filter is the past 24 hours, so every
    # posting gets roughly four chances to be seen inside its visibility window and
    # a single failed run costs nothing. Per-run caps in config.py are quartered to
    # match, so the daily LLM spend is unchanged.
    - cron: "0 0,6,12,18 * * *"

permissions:
  actions: read
  contents: read

# Runs must not overlap — a second scrape while the first is mid-flight would race
# on dedup and double-score. cancel-in-progress stays false: the run already going
# is the one with work in flight, so the newcomer waits rather than killing it.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  # Resolves the matrix only. There is deliberately NO "did today's run already
  # happen" guard any more: that premise died with the once-a-day schedule, and
  # keyed on the dashboard step it would have suppressed runs 2, 3 and 4. Overlap
  # is handled by the `concurrency` block above, which is native and needs no jq
  # against run history.
  resolve-sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.sources.outputs.list }}
    steps:
      - name: Resolve which sources to scrape
        id: sources
        env:
          REQUESTED: ${{ github.event.inputs.sources }}
        run: |
          # Default matrix. Add a leg here when a new source lands (Arbeitsagentur
          # in Step B.0, the ATS adapters in B.2) — scraper.py --source must know
          # the same name.
          DEFAULT='["linkedin"]'
          if [ -z "$REQUESTED" ]; then
            echo "list=$DEFAULT" >> "$GITHUB_OUTPUT"
          else
            LIST=$(echo "$REQUESTED" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' \
                   | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin]))')
            echo "list=$LIST" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ── Stage 1: scrape ───────────────────────────────────────────────────────
  # One runner per source, in parallel: wall-clock is max(sources), not sum.
  # fail-fast: false — a LinkedIn block must not cancel the other legs, and a leg
  # that fetches zero exits non-zero on purpose (see scrape_guard).
  scrape:
    needs: resolve-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.resolve-sources.outputs.sources) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "Scrape ${{ matrix.source }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py --source "${{ matrix.source }}"

  # ── Stage 2: score ────────────────────────────────────────────────────────
  # !cancelled() rather than success(): whatever did land still deserves scoring.
  # A dead scrape leg shows as a red run; it must not skip the rest of the day.
  score:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Score Jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: python score_jobs.py

      - name: Customize Resumes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python custom_resume_generator.py

  # ── Stage 3: manage ───────────────────────────────────────────────────────
  # Same !cancelled() reasoning as score: a red scrape leg must not cost the
  # run its housekeeping.
  manage:
    needs: score
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Manage Jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python job_manager.py

      - name: Generate Dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dashboard.py

      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 7
