<html><head><script data-ch type="application/ld+json">{"@context":"https:\u002F\u002Fschema.org\u002F","@type":"JobPosting","title":"Data and Analytics Engineer (w\u002Fm\u002Fd)","description":"\n    null\n    null\n    Unternehmensbeschreibung\u003Cbr\u003E\u003Cbr\u003E\u003Cp\u003EAls Digital-Versorger der Regionen nutzen wir Chancen, beweisen Tatkraft, übernehmen Verantwortung, arbeiten auf Augenhöhe. Mit über 1.900 Kolleginnen und Kollegen, den Kommunen, der Wirtschaft, der Gesellschaft. Du mit uns für mehr Gemeinschaft. Ganz nach unserem Motto: Gemeinsam Großes gestalten.\u003C\u002Fp\u003E\n    null\n    Stellenbeschreibung\u003Cbr\u003E\u003Cbr\u003E\u003Cul\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EEntwicklung von Cloud-basierten Datenprodukten:\u003C\u002Fstrong\u003E Den gesamten Lebenszyklus moderner Datenlösungen begleitest du von der Konzeption über Entwicklung und Deployment bis zum produktiven Betrieb.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EWeiterentwicklung von Daten- und Analytics-Anwendungen:\u003C\u002Fstrong\u003E Bestehende Lösungen und Prozesse entwickelst du kontinuierlich weiter und stellst einen zuverlässigen Betrieb sicher.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EZusammenarbeit mit Fachbereichen:\u003C\u002Fstrong\u003E Gemeinsam mit Marketing, Sales, Finance und Produktmanagement entwickelst du aus fachlichen Anforderungen skalierbare technische und analytische Lösungen.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EZusammenarbeit mit Data-Teams und Dienstleistern:\u003C\u002Fstrong\u003E Die Abstimmung mit Data Analysts, Data Scientists, Data Engineers, zentralen BI-Teams und externen Partnern unterstützt du bei der erfolgreichen Umsetzung datengetriebener Vorhaben.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EWeiterentwicklung von Data Governance:\u003C\u002Fstrong\u003E Prozesse, Standards und Best Practices gestaltest du aktiv mit und unterstützt eine nachhaltige Datenlandschaft.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003ESicherstellung der Datenqualität:\u003C\u002Fstrong\u003E Die kontinuierliche Verbesserung der Datenqualität und transparenter Datenstrukturen treibst du voran.\u003C\u002Fli\u003E\n\u003Cli\u003E\n\u003Cstrong\u003EIdentifikation von Automatisierungspotenzialen:\u003C\u002Fstrong\u003E Möglichkeiten zur Automatisierung bewertest du und entwickelst mithilfe moderner Technologien und KI geeignete Lösungen.\u003C\u002Fli\u003E\n\u003C\u002Ful\u003E\n    null\n    Qualifikationen\u003Cbr\u003E\u003Cbr\u003E\u003Cul\u003E\n\u003Cli\u003EAbgeschlossenes \u003Cstrong\u003EStudium\u003C\u002Fstrong\u003E in Informatik, Wirtschaftsinformatik, Data Science oder einem vergleichbaren Fachgebiet\u003C\u002Fli\u003E\n\u003Cli\u003EMehrjährige Berufserfahrung als \u003Cstrong\u003EAnalytics Engineer\u003C\u002Fstrong\u003E, Data Engineer, Data Architect oder in einer vergleichbaren \u003Cstrong\u003Etechnischen Datenrolle\u003C\u002Fstrong\u003E\n\u003C\u002Fli\u003E\n\u003Cli\u003EErfahrung in der Entwicklung \u003Cstrong\u003Eskalierbarer Datenpipelines\u003C\u002Fstrong\u003E sowie analytischer Datenmodelle\u003C\u002Fli\u003E\n\u003Cli\u003ESicherer Umgang mit \u003Cstrong\u003ESnowflake\u003C\u002Fstrong\u003E, \u003Cstrong\u003Edbt\u003C\u002Fstrong\u003E und \u003Cstrong\u003ESQL\u003C\u002Fstrong\u003E sowie gute Programmierkenntnisse in Python\u003C\u002Fli\u003E\n\u003Cli\u003EBereitschaft, sich Wissen in Web-Technologien wie Angular, TypeScript oder Next.js anzueignen\u003C\u002Fli\u003E\n\u003Cli\u003EErfahrung in \u003Cstrong\u003EData Governance\u003C\u002Fstrong\u003E, \u003Cstrong\u003EData Lineage\u003C\u002Fstrong\u003E und der Sicherstellung einer hohen Datenqualität\u003C\u002Fli\u003E\n\u003Cli\u003EInteresse an \u003Cstrong\u003EAutomatisierung\u003C\u002Fstrong\u003E, \u003Cstrong\u003EKünstlicher Intelligenz \u003C\u002Fstrong\u003Eund der kontinuierlichen Weiterentwicklung von Daten- und Analytics-Lösunge
